<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        <style>
        html, body {
            background-color: #ffffff;
        }
        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #444444!important;
        }
        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        } 
        </style>

        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>
        <title></title>
        <style>
            .fossil-popup-box {
                display: block !important;
                position: absolute;
                background-color: #ffffff;
                box-shadow: 0 3px 10px rgba(0,0,0,0.3);
                padding: 12px 16px;
                border-radius: 6px;
                border: 1px solid #cccccc;
                bottom: 12px;
                left: -50px;
                min-width: 180px;
                z-index: 9999 !important;
                font-family: sans-serif;
                font-size: 13px;
                color: #333333;
            }
            .fossil-popup-closer {
                text-decoration: none;
                position: absolute;
                top: 4px;
                right: 8px;
                color: #888888;
                font-weight: bold;
                font-size: 14px;
            }
            .fossil-popup-closer:after {
                content: "✖";
            }
        </style>
    </head>
    <body>
        <div id="layer-control" class="control-panel">
          <h3>Paleoclimate Layers</h3>
          
          <div class="layer-row">
            <label><input type="checkbox" id="chk-lsm" checked> Land-Sea Mask</label>
            <input type="range" id="op-lsm" min="0" max="1" step="0.1" value="1">
          </div>
          
          <div class="layer-row">
            <label><input type="checkbox" id="chk-topo"> Topography</label>
            <input type="range" id="op-topo" min="0" max="1" step="0.1" value="0.8">
          </div>
        
          <div class="layer-row">
            <label><input type="checkbox" id="chk-sst"> Sea Surface Temp</label>
            <input type="range" id="op-sst" min="0" max="1" step="0.1" value="0.8">
          </div>
        
          <div class="layer-row">
            <label><input type="checkbox" id="chk-biome"> Megabiomes</label>
            <input type="range" id="op-biome" min="0" max="1" step="0.1" value="0.8">
          </div>
        
          <div class="layer-row">
            <label><input type="checkbox" id="chk-soil"> Soil Types</label>
            <input type="range" id="op-soil" min="0" max="1" step="0.1" value="0.8">
          </div>
        
          <div class="layer-row">
            <label><input type="checkbox" id="chk-ice"> Ice Mask</label>
            <input type="range" id="op-ice" min="0" max="1" step="0.1" value="0.9">
          </div>
        
          <div class="layer-row">
            <label><input type="checkbox" id="chk-lake"> Lakes</label>
            <input type="range" id="op-lake" min="0" max="1" step="0.1" value="0.9">
          </div>
        </div>
        <div id="map">
            <div id="fossil-popup" class="fossil-popup-box">
                <a href="#" id="fossil-popup-closer" class="fossil-popup-closer"></a>
                <div id="fossil-popup-content"></div>
            </div>
        </div>
        <div id="popup" class="ol-popup">
            <a href="#" id="popup-closer" class="ol-popup-closer"></a>
            <div id="popup-content"></div>
        </div>
        <script src="resources/qgis2web_expressions.js"></script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="resources/olms.js"></script>
        <script src="./layers/layers.js" type="text/javascript"></script> 
        <script src="./resources/Autolinker.min.js"></script>
        <script src="resources/qgis2web.js"></script>
    </body>
</html>
